<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avinash Tiwari</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=BBH+Hegarty&family=BBH+Hegarty&display=swap');

  :root{
    --bg:#0a0c10;
    --paper:#ffffff;
    --paper-dark:#ffffff;
    --paper-light:#ffffff;
    --ink:#101318;
    --muted:#69717a;
    --line:rgba(7,46,25,.22);
    --cord:#c8cdd1;
    --cord-dark:#777e84;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}

  body{
    background:#12151c;
    font-family:'Inter',sans-serif;
    position:relative;
  }

  .bg-gif{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
  }

  /* Subtle dark glass layer keeps the badge readable over any GIF. */
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.12);
    pointer-events:none;
    z-index:-1;
  }

  canvas#rope{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:3;
  }

  /* =========================
     RETRACTABLE BADGE REEL
     ========================= */
  .reel{
    position:fixed;
    top:18px;
    left:175px;
    width:108px;
    height:108px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 31% 25%, rgba(255,255,255,.14) 0 3%, transparent 12%),
      radial-gradient(circle at 38% 31%, #3f4347 0 7%, #292c30 23%, #1b1d20 50%, #111316 73%, #08090a 100%);
    border:6px solid #0a0b0d;
    box-shadow:
      0 14px 26px rgba(0,0,0,.55),
      0 3px 6px rgba(0,0,0,.4),
      inset 0 2px 2px rgba(255,255,255,.18),
      inset 0 -7px 11px rgba(0,0,0,.78);
    z-index:7;
    pointer-events:auto;
    cursor:grab;
    touch-action:none;
    overflow:visible;
  }

  .reel::before{
    content:'';
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.55),
      inset 0 0 0 3px rgba(255,255,255,.055),
      0 0 0 1px rgba(0,0,0,.5);
  }

  .reel::after{
    content:'';
    position:absolute;
    width:30px;
    height:30px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #565b60 0 7%, #292d31 30%, #17191c 68%, #0b0c0e 100%);
    border:2px solid #090a0c;
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.14),
      inset 0 -3px 5px rgba(0,0,0,.8),
      0 1px 2px rgba(0,0,0,.55);
  }

  .reel .reel-belt{
    z-index:2;
    height:18px;
    width:22px;
    bottom:-13px;
    background:linear-gradient(90deg,#3f4549 0%,#d6dadd 42%,#7d8489 56%,#2f3438 100%);
    border:1px solid #17191b;
    border-radius:3px 3px 5px 5px;
    box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.55);
  }

  .reel .reel-outlet{
    z-index:3;
    bottom:-20px;
    width:11px;
    height:14px;
    background:
      linear-gradient(90deg,#666d72,#eef1f2 45%,#92989d 58%,#454b50);
    border:1px solid #30353a;
    border-radius:1px 1px 5px 5px;
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.7);
  }

  .reel.dragging{
    cursor:grabbing;
  }

  .reel-belt{position:absolute;left:50%;transform:translateX(-50%);}
  .reel-outlet{position:absolute;left:50%;transform:translateX(-50%);}


  /* =========================
     BADGE CARD
     ========================= */
  .card{
    position:fixed;
    width:286px;
    min-height:390px;
    top:0;
    left:22px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.25) 0%, rgba(255,255,255,.10) 22%, rgba(255,255,255,.055) 52%, rgba(255,255,255,.16) 100%),
      rgba(255,255,255,0.105);
    border-radius:16px;
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    border:1px solid rgba(255,255,255,.42);
    outline:1px solid rgba(20,24,28,.12);
    box-shadow:
      0 24px 42px -12px rgba(0,0,0,.58),
      0 4px 10px rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.58),
      inset 0 -1px 0 rgba(0,0,0,.10),
      inset 0 0 24px rgba(255,255,255,.055);
    cursor:grab;
    user-select:none;
    touch-action:none;
    will-change:transform;
    transition:box-shadow .2s ease;
    z-index:4;
  }

  /* Moving specular reflection: the highlight stays clipped inside the plastic card and shifts with card motion. */
  .card-shine{
    position:absolute;
    inset:0;
    border-radius:16px;
    pointer-events:none;
    z-index:20;
    clip-path:inset(0 round 16px);
    overflow:hidden;
    background:
      radial-gradient(ellipse 34% 78% at var(--shine-x,50%) var(--shine-y,35%),
        rgba(255,255,255,.34) 0%,
        rgba(255,255,255,.16) 22%,
        rgba(255,255,255,.055) 48%,
        transparent 72%),
      linear-gradient(var(--shine-angle,112deg),
        transparent 0%,
        transparent 40%,
        rgba(255,255,255,.06) 44%,
        rgba(255,255,255,.30) 48%,
        rgba(255,255,255,.09) 52%,
        transparent 58%,
        transparent 100%);
    mix-blend-mode:screen;
    opacity:.78;
    filter:blur(.35px);
    will-change:transform,opacity,background;
  }

  .card-shine::before{
    content:'';
    position:absolute;
    inset:1px;
    border-radius:15px;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.42),
      inset 1px 0 1px rgba(255,255,255,.18),
      inset -1px 0 1px rgba(255,255,255,.12),
      inset 0 -1px 1px rgba(0,0,0,.08);
  }

  .card-shine::after{
    content:'';
    position:absolute;
    width:75%;
    height:180%;
    left:var(--shine-x,50%);
    top:var(--shine-y,35%);
    transform:translate(-50%,-50%) rotate(var(--shine-angle,112deg));
    transform-origin:center;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 46%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.08) 54%,transparent);
    opacity:.55;
    filter:blur(4px);
  }

  .card::before{
    content:'';
    position:absolute;
    top:0;
    left:90px;
    right:0;
    height:43px;
    border-bottom:2px solid rgba(20,24,28,.10);
    border-radius:16px 16px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.035));
    pointer-events:none;
  }

  .card::after{
    content:'';
    position:absolute;
    left:10px;
    right:10px;
    top:47px;
    height:1px;
    border-top:1px dashed rgba(20,24,28,.13);
    pointer-events:none;
  }

  .card.dragging{
    cursor:grabbing;
    box-shadow:
      0 34px 58px -12px rgba(0,0,0,.68),
      0 8px 16px rgba(0,0,0,.24),
      inset 0 1px rgba(255,255,255,.24);
  }

  .card:focus-visible{
    outline:2px solid #fff;
    outline-offset:4px;
  }

  /* =========================
     REALISTIC CARD / CORD CONNECTOR
     The hardware is visually mounted to the card; the rope meets the
     center of the metal eyelet instead of appearing to float over it.
     ========================= */
  .badge-attachment{
    position:absolute;
    top:-19px;
    left:50%;
    width:38px;
    height:43px;
    transform:translateX(-50%);
    z-index:9;
    pointer-events:none;
    transform-origin:50% 31px;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.28));
  }

  /* Metal mounting plate sitting directly on the card. */
  .badge-attachment::before{
    content:'';
    position:absolute;
    left:50%;
    top:18px;
    width:24px;
    height:16px;
    transform:translateX(-50%);
    border-radius:7px 7px 9px 9px;
    background:
      linear-gradient(90deg,#565c61 0%,#e8ebed 24%,#ffffff 45%,#9aa1a6 67%,#444a4f 100%);
    border:1px solid #3d4246;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.8),
      inset 0 -2px 3px rgba(0,0,0,.35),
      0 1px 2px rgba(0,0,0,.35);
  }

  /* Short metal neck between the mounting plate and swivel ring. */
  .badge-attachment .neck{
    position:absolute;
    left:50%;
    top:10px;
    width:9px;
    height:22px;
    transform:translateX(-50%);
    border-radius:3px 3px 5px 5px;
    background:
      linear-gradient(90deg,#41474b 0%,#aeb5b9 22%,#f7f8f8 43%,#9ba2a7 63%,#3d4348 100%);
    border:1px solid #444a4e;
    box-shadow:
      inset 1px 0 rgba(255,255,255,.5),
      inset -1px 0 rgba(0,0,0,.28),
      0 1px 2px rgba(0,0,0,.32);
  }

  /* Swivel eyelet: the cord visually enters this hole. */
  .badge-attachment .loop{
    position:absolute;
    left:50%;
    top:0;
    width:23px;
    height:23px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%,#ffffff 0 7%,#d9dddf 16%,#8d959a 35%,#4d5358 48%,#c8cdd0 61%,#747b80 74%,#363b3f 100%);
    border:2px solid #4b5155;
    box-shadow:
      0 1px 2px rgba(0,0,0,.45),
      inset 1px 1px 1px rgba(255,255,255,.65),
      inset -2px -2px 3px rgba(0,0,0,.38);
  }

  .badge-attachment .loop::after{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 30%,#5f666b 0 12%,#252a2e 35%,#080a0c 68%,#3d4347 100%);
    border:1px solid #171a1d;
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,.2),
      0 1px 1px rgba(255,255,255,.25);
  }

  /* Recessed punched hole visible immediately beneath the hardware. */
  .badge-hole{
    position:absolute;
    top:7px;
    left:50%;
    width:27px;
    height:13px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(ellipse at 50% 42%,#050607 0 32%,#171a1d 45%,#454b50 55%,#d4d8da 59%,#777e83 72%,#24282b 100%);
    box-shadow:
      inset 0 2px 3px rgba(0,0,0,.72),
      0 1px 1px rgba(255,255,255,.16);
    pointer-events:none;
    z-index:8;
  }

  .card-inner{
    position:relative;
    overflow:hidden;
    z-index:2;
    padding:38px 16px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* Soft glossy reflection across the transparent plastic. */
  .card-inner::before{
    content:'';
    position:absolute;
    top:-18%;
    left:-45%;
    width:58%;
    height:145%;
    transform:rotate(18deg);
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.22) 48%, transparent 100%);
    filter:blur(7px);
    opacity:.55;
    pointer-events:none;
    z-index:0;
  }

  .card-inner > *{
    position:relative;
    z-index:1;
  }

  .badge-title{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    letter-spacing:.17em;
    color:#075d2e;
    font-weight:600;
    margin-bottom:10px;
  }

  .id-panel{
    width:100%;
    height:270px;
    padding:0;
    border-radius:14px;
    background:transparent;
    border:none;
    box-shadow:none;
    position:relative;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .id-panel::before,
  .id-panel::after{
    display:none;
  }

  .avatar{
    width:210px;
    height:210px;
    border-radius:0;
    margin:0;
    background-color:#34394a;
    background-size:cover;
    background-position:50% 22%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    color:#fff;
    letter-spacing:.02em;
    border:1px solid rgba(255,255,255,.38);
    box-shadow:0 2px 9px rgba(0,0,0,.20), inset 0 1px rgba(255,255,255,.35);
    overflow:hidden;
    position:relative;
    z-index:2;
  }


  .card-name{
    margin:-2px 0 0;
    width:100%;
    min-height:25px;
    text-align:center;
    font-family:'BBH Hegarty',sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.1;
    color:#3f4144;
    letter-spacing:.01em;
    white-space:nowrap;
  }

  /* Single-line looping keyboard/typewriter effect. */
  .card-details{
    width:100%;
    min-height:22px;
    margin-top:7px;
    text-align:center;
    font-family:'BBH Hegarty',sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1.1;
    color:#3f4144;
    letter-spacing:.01em;
    white-space:nowrap;
  }

  .card-name{
    width:100%;
    min-height:50px;
  }

  .name-line{
    display:block;
    line-height:1.1;
  }

  .name-line:first-child{
    margin-bottom:8px;
  }

  .divider{
    width:100%;
    height:1px;
    background:rgba(255,255,255,.18);
    margin:14px 0 11px;
  }

  @media (max-width:520px){
    .reel{width:88px;height:88px;top:12px;border-width:5px;}
    .card{width:260px;min-height:370px;}
    .card-inner{padding-left:13px;padding-right:13px;}
    .id-panel{height:220px;}
    .avatar{width:210px;height:210px;}
    .card-name{font-size:18px;}
  }
</style>
</head>
<body>

<img class="bg-gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZG1tcmVubTVpYjNjcDNscmw2eng5dnkwY2YxN3VtZjlwOXE4MjBjcCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/2aQS3AHfvvfIkSdbFM/giphy.gif" alt="">

<script>
(function(){
  const canvas = document.getElementById('rope');
  const ctx = canvas.getContext('2d');
  const card = document.getElementById('card');
  const reel = document.getElementById('reel');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Single-line looping keyboard/typewriter animation.
  const cardName = document.getElementById('cardName');
  const introText = 'Hi!';
  const nameTop = "I'M";
  const nameBottom = "AVINASH TIWARI";
  const nameText = `${nameTop}\n${nameBottom}`;
  let lineIndex = 0;
  let phase = 'showIntro';

  function typeName(){
    if(reduceMotion){
      cardName.innerHTML = `<span class="name-line">${nameTop}</span><span class="name-line">${nameBottom}</span>`;
      return;
    }

    if(phase === 'showIntro'){
      cardName.textContent = introText;
      phase = 'pauseIntro';
      setTimeout(typeName,1100);
      return;
    }

    if(phase === 'pauseIntro'){
      lineIndex = introText.length;
      phase = 'deletingIntro';
      setTimeout(typeName,120);
      return;
    }

    if(phase === 'deletingIntro'){
      lineIndex--;
      cardName.textContent = introText.slice(0,lineIndex);
      if(lineIndex <= 0){
        phase = 'typingName';
        lineIndex = 0;
        setTimeout(typeName,180);
        return;
      }
      setTimeout(typeName,55);
      return;
    }

    if(phase === 'typingName'){
      lineIndex++;
      { const partial = nameText.slice(0,lineIndex); const parts = partial.split('\n'); cardName.innerHTML = `<span class="name-line">${parts[0] || ''}</span><span class="name-line">${parts[1] || ''}</span>`; }
      if(lineIndex >= nameText.length){
        phase = 'pauseName';
        setTimeout(typeName,1200);
        return;
      }
      setTimeout(typeName,85);
      return;
    }

    if(phase === 'pauseName'){
      lineIndex = nameText.length;
      phase = 'deletingName';
      setTimeout(typeName,120);
      return;
    }

    if(phase === 'deletingName'){
      lineIndex--;
      { const partial = nameText.slice(0,lineIndex); const parts = partial.split('\n'); cardName.innerHTML = `<span class="name-line">${parts[0] || ''}</span><span class="name-line">${parts[1] || ''}</span>`; }
      if(lineIndex <= 0){
        phase = 'showIntro';
        setTimeout(typeName,500);
        return;
      }
      setTimeout(typeName,55);
    }
  }
  setTimeout(typeName,500);

  let anchorX = 0, anchorY = 0;
  let points = [];
  let dragging = false;
  let draggingReel = false;
  let pointerX = 0, pointerY = 0;
  let reelPointerX = 0, reelPointerY = 0;
  let lastAnchorX = 0, lastAnchorY = 0;
  let lastTime = performance.now();

  // Dynamic badge body: this is what gives the card actual momentum.
  let cardX = 0, cardY = 0;
  let cardVX = 0, cardVY = 0;
  let lastPointerX = 0, lastPointerY = 0;
  let dragPointerVX = 0, dragPointerVY = 0;

  const REST_LENGTH = 155;
  const MIN_LENGTH = 80;
  const MAX_LENGTH = 760;

  const CARD_MASS = 3.8;

  const RETURN_DAMPING = 0.972;
  const TENSION_SPRING = 0.040;
  const TENSION_DAMPING = 0.965;
  const ITERATIONS = 42;
  let ropeLength = REST_LENGTH;
  let desiredLength = REST_LENGTH;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    updateAnchor();
  }

  function updateAnchor(){
    const r = reel.getBoundingClientRect();
    anchorX = r.left + r.width / 2;
    // Cord starts exactly from the little metal outlet.
    anchorY = r.bottom + 15;
  }

  function resetPhysics(){
    updateAnchor();
    cardY = Math.min(window.innerHeight - card.offsetHeight / 2 - 12, anchorY + REST_LENGTH);
    // Start the card so its left-screen gap matches its bottom-screen gap.
    const bottomGap = Math.max(0, window.innerHeight - cardY - card.offsetHeight);
    cardX = bottomGap + card.offsetWidth / 2 + 90;
    cardVX = reduceMotion ? 0 : 0.75;
    cardVY = 0;
    pointerX = cardX;
    pointerY = cardY;
    lastPointerX = cardX;
    lastPointerY = cardY;
    dragPointerVX = dragPointerVY = 0;
    ropeLength = REST_LENGTH;
    lastAnchorX = anchorX;
    lastAnchorY = anchorY;

    points = [];
    for(let i=0;i<NUM_POINTS;i++){
      const t = i/(NUM_POINTS-1);
      // Start with a visible little side-to-side sag/swing.
      const swing = reduceMotion ? 0 : Math.sin(t*Math.PI) * 12;
      const x = anchorX + swing;
      const y = anchorY + REST_LENGTH*t;
      points.push({x,y,oldx:x-cardVX*0.3,oldy:y-cardVY*0.3});
    }
  }

  function pointerPos(e){
    return {x:e.clientX, y:e.clientY};
  }

  function keepInsideViewport(x,y){
    const w = card.offsetWidth, h = card.offsetHeight, m = 8;
    return {
      x:Math.max(w/2+m, Math.min(window.innerWidth-w/2-m, x)),
      y:Math.max(h/2+m, Math.min(window.innerHeight-h/2-m, y))
    };
  }

  resize();
  resetPhysics();
  window.addEventListener('resize',()=>{ resize(); resetPhysics(); });

  // The reel itself is draggable. Pointer Events make mouse + touch behave
  // identically and pointer capture prevents the drag from getting lost.
  let reelGrabOffsetX = 0;
  let reelGrabOffsetY = 0;
  let reelPointerId = null;

  function startReelDrag(e){
    if(e.button !== undefined && e.button !== 0) return;

    draggingReel = true;
    reelPointerId = e.pointerId;
    reel.classList.add('dragging');

    const r = reel.getBoundingClientRect();
    const centerX = r.left + r.width/2;
    const centerY = r.top + r.height/2;
    reelGrabOffsetX = e.clientX - centerX;
    reelGrabOffsetY = e.clientY - centerY;

    // Stop the card from fighting the reel drag while the reel is being moved.
    cardVX = 0;
    cardVY = 0;
    lastAnchorX = anchorX;
    lastAnchorY = anchorY;

    try { reel.setPointerCapture(e.pointerId); } catch(_) {}
    e.preventDefault();
    e.stopPropagation();
  }

  function moveReelDrag(e){
    if(!draggingReel || (reelPointerId !== null && e.pointerId !== reelPointerId)) return;

    const r = reel.getBoundingClientRect();
    const halfW = r.width/2;
    const halfH = r.height/2;

    // Calculate the new CENTER directly from the pointer. This avoids the
    // transform/left coordinate error that made the reel appear to stick.
    let centerX = e.clientX - reelGrabOffsetX;
    let centerY = e.clientY - reelGrabOffsetY;

    centerX = Math.max(halfW + 4, Math.min(window.innerWidth - halfW - 4, centerX));
    centerY = Math.max(halfH + 4, Math.min(window.innerHeight - halfH - 4, centerY));

    reel.style.left = centerX + 'px';
    reel.style.top = centerY + 'px';
    reel.style.transform = 'translate(-50%, -50%)';

    // IMPORTANT: do not translate the badge with the reel.
    // A heavy badge has inertia, so the reel moves first and the cord
    // transfers that motion to the card a moment later. The rope points
    // are intentionally left in world space so the cord can swing and
    // become taut naturally.
    updateAnchor();
    lastAnchorX = anchorX;
    lastAnchorY = anchorY;
    e.preventDefault();
    e.stopPropagation();
  }

  function endReelDrag(e){
    if(!draggingReel) return;
    if(e && reelPointerId !== null && e.pointerId !== reelPointerId) return;

    draggingReel = false;
    reel.classList.remove('dragging');
    try {
      if(reelPointerId !== null) reel.releasePointerCapture(reelPointerId);
    } catch(_) {}
    reelPointerId = null;
    updateAnchor();
    lastAnchorX = anchorX;
    lastAnchorY = anchorY;
  }

  let cardPointerId = null;

  function startDrag(e){
    // Social links are clickable and must never start card dragging.
    if(e.target.closest('.socials a')) return;
    if(draggingReel) return;
    if(e.button !== undefined && e.button !== 0) return;

    dragging = true;
    cardPointerId = e.pointerId;
    card.classList.add('dragging');

    const p = pointerPos(e);
    pointerX = lastPointerX = p.x;
    pointerY = lastPointerY = p.y;
    dragPointerVX = cardVX;
    dragPointerVY = cardVY;

    try { card.setPointerCapture(e.pointerId); } catch(_) {}
    e.preventDefault();
    e.stopPropagation();
  }

  function moveDrag(e){
    if(!dragging || (cardPointerId !== null && e.pointerId !== cardPointerId)) return;
    const p = pointerPos(e);
    dragPointerVX = p.x-lastPointerX;
    dragPointerVY = p.y-lastPointerY;
    pointerX = p.x;
    pointerY = p.y;
    lastPointerX = p.x;
    lastPointerY = p.y;
    e.preventDefault();
  }

  function endDrag(e){
    if(!dragging) return;
    if(e && cardPointerId !== null && e.pointerId !== cardPointerId) return;

    dragging = false;
    cardVX = dragPointerVX * 0.9;
    cardVY = dragPointerVY * 0.9;
    card.classList.remove('dragging');
    try {
      if(cardPointerId !== null) card.releasePointerCapture(cardPointerId);
    } catch(_) {}
    cardPointerId = null;
  }

  reel.addEventListener('pointerdown',startReelDrag);
  reel.addEventListener('pointermove',moveReelDrag);
  reel.addEventListener('pointerup',endReelDrag);
  reel.addEventListener('pointercancel',endReelDrag);

  // Keep social links independent from the draggable card.
  document.querySelectorAll('.socials a').forEach(link=>{
    link.addEventListener('pointerdown', e=>e.stopPropagation());
    link.addEventListener('click', e=>e.stopPropagation());
  });

  card.addEventListener('pointerdown',startDrag);
  card.addEventListener('pointermove',moveDrag);
  card.addEventListener('pointerup',endDrag);
  card.addEventListener('pointercancel',endDrag);

  function update(dt){
    const scale = Math.min(2,dt/16.6667);
    const restX = anchorX;
    const restY = anchorY + REST_LENGTH;

    if(draggingReel){
      // The reel is the moving mass. The heavy card resists acceleration,
      // so only gravity + cord tension act on it while the reel is moved.
      const dx = anchorX - cardX;
      const dy = anchorY - cardY;
      const dist = Math.hypot(dx,dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      const slackLimit = ropeLength * 0.94;
      const stretch = Math.max(0, dist - slackLimit);

      if(stretch > 0){
        const tension = stretch * TENSION_SPRING / CARD_MASS;
        cardVX += ux * tension * scale;
        cardVY += uy * tension * scale;
      }
      cardVY += GRAVITY * scale;
      cardVX *= Math.pow(TENSION_DAMPING,scale);
      cardVY *= Math.pow(TENSION_DAMPING,scale);
      cardX += cardVX * scale;
      cardY += cardVY * scale;
      desiredLength = Math.min(MAX_LENGTH, Math.max(MIN_LENGTH, dist));
    }else if(dragging){
      const safe = keepInsideViewport(pointerX,pointerY);
      let dx=safe.x-anchorX, dy=safe.y-anchorY;
      const dist=Math.hypot(dx,dy)||1;
      const allowed=Math.min(MAX_LENGTH,Math.max(MIN_LENGTH,dist));
      const targetX=anchorX+dx*allowed/dist;
      const targetY=anchorY+dy*allowed/dist;

      // The card follows the hand immediately, but with a tiny amount of
      // smoothing so the rope gets a chance to form a natural curve.
      const oldX=cardX, oldY=cardY;
      cardX += (targetX-cardX)*0.82;
      cardY += (targetY-cardY)*0.82;
      cardVX = (cardX-oldX)*0.85;
      cardVY = (cardY-oldY)*0.85;
      desiredLength=Math.min(MAX_LENGTH,Math.max(MIN_LENGTH,Math.hypot(cardX-anchorX,cardY-anchorY)));
    }else{
      // Heavy-card pendulum: gravity dominates, while the retracting reel
      // applies a soft restoring force instead of snapping the badge upward.
      const dx=restX-cardX;
      const dy=restY-cardY;
      cardVX += dx*RETURN_SPRING*scale;
      cardVY += dy*RETURN_SPRING*scale;
      cardVY += GRAVITY*scale;
      cardVX *= Math.pow(RETURN_DAMPING,scale);
      cardVY *= Math.pow(RETURN_DAMPING,scale);
      cardX += cardVX*scale;
      cardY += cardVY*scale;

      // Do not clamp the card upward when the reel is moved near the
      // bottom of the screen. The badge should always hang below the reel;
      // it may naturally continue below the viewport.
      desiredLength=REST_LENGTH;
    }

    // Retractable reel: cord length changes while pulling and retracts after release.
    // Heavy card + retractable reel: extension follows the hand quickly,
    // but retraction is deliberately slower and smoother.
    const lengthEase=dragging?0.42:(draggingReel?0.018:0.032);
    ropeLength += (desiredLength-ropeLength)*lengthEase;
    ropeLength=Math.max(MIN_LENGTH,Math.min(MAX_LENGTH,ropeLength));
    const segLen=ropeLength/(NUM_POINTS-1);

    // Verlet rope simulation.
    for(let i=1;i<NUM_POINTS;i++){
      const p=points[i];
      const vx=(p.x-p.oldx)*Math.pow(ROPE_DAMPING,scale);
      const vy=(p.y-p.oldy)*Math.pow(ROPE_DAMPING,scale);
      p.oldx=p.x; p.oldy=p.y;
      p.x+=vx;
      p.y+=vy+GRAVITY*0.22*scale;
    }

    const last=NUM_POINTS-1;
    if(dragging){
      points[last].oldx=points[last].x;
      points[last].oldy=points[last].y;
      points[last].x=cardX;
      points[last].y=cardY;
    }else{
      // Keep the endpoint locked to the badge while preserving the rest of
      // the rope's inertia. Only the endpoint is pinned; intermediate
      // points remain free to move smoothly.
      points[last].oldx=points[last].x;
      points[last].oldy=points[last].y;
      points[last].x=cardX;
      points[last].y=cardY;
    }

    // Constraint passes create the flexible rope rather than a straight SVG line.
    for(let iter=0;iter<ITERATIONS;iter++){
      for(let i=0;i<NUM_POINTS-1;i++){
        const a=points[i], b=points[i+1];
        const dx=b.x-a.x, dy=b.y-a.y;
        const d=Math.hypot(dx,dy)||0.0001;
        const diff=(d-segLen)/d;
        const ox=dx*0.5*diff, oy=dy*0.5*diff;
        if(i!==0){a.x+=ox;a.y+=oy;}
        if(!(i+1===last)){b.x-=ox;b.y-=oy;}
      }
      points[0].x=anchorX; points[0].y=anchorY;
      points[last].x=cardX; points[last].y=cardY;
    }

    // Let rope tension feed a little movement back into the badge.
    if(!dragging){
      const end=points[last-1];
      cardVX += (end.x-cardX)*0.010/CARD_MASS;
      cardVY += (end.y-cardY)*0.007/CARD_MASS;
      cardVX *= Math.pow(AIR_DAMPING,scale);
      cardVY *= Math.pow(AIR_DAMPING,scale);
    }
  }

  function drawCord(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!points.length) return;

    function trace(offsetX=0,offsetY=0){
      ctx.beginPath();
      ctx.moveTo(points[0].x+offsetX,points[0].y+offsetY);
      for(let i=1;i<NUM_POINTS-1;i++){
        const p=points[i], q=points[i-1];
        ctx.quadraticCurveTo(
          q.x+offsetX,q.y+offsetY,
          (p.x+q.x)/2+offsetX,(p.y+q.y)/2+offsetY
        );
      }
      const a=points[NUM_POINTS-2];
      const b=points[NUM_POINTS-1];
      // The simulation endpoint remains at the card's top-center.
      // Visually terminate the cord in the center of the metal swivel ring.
      const connectorX=b.x;
      const connectorY=b.y-8;
      ctx.quadraticCurveTo(
        a.x+offsetX,a.y+offsetY,
        connectorX+offsetX,connectorY+offsetY
      );
    }

    // Soft contact shadow: the cord sits slightly above the background.
    trace(2.2,3.0);
    ctx.strokeStyle='rgba(0,0,0,.34)';
    ctx.lineWidth=6.2;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.stroke();

    // Outer rubber/nylon jacket.
    trace();
    ctx.strokeStyle='#171a1c';
    ctx.lineWidth=4.8;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.stroke();

    // Subtle braided texture. Dashed highlights follow the same physical path.
    trace(-0.15,-0.2);
    ctx.strokeStyle='rgba(255,255,255,.13)';
    ctx.lineWidth=1.35;
    ctx.setLineDash([3.5,4.5]);
    ctx.lineDashOffset=performance.now()*-0.002;
    ctx.stroke();
    ctx.setLineDash([]);

    // Narrow specular edge makes the cord read as woven nylon rather than a flat line.
    trace(-0.45,-0.25);
    ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.lineWidth=.72;
    ctx.stroke();

    // Tiny black grommet where the cord exits the reel.
    const a=points[0];
    ctx.beginPath();
    ctx.arc(a.x,a.y,5.2,0,Math.PI*2);
    ctx.fillStyle='#0b0d0f';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(a.x,a.y,3.2,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.22)';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  function render(){
    updateAnchor();
    drawCord();

    const last=points[NUM_POINTS-1];
    const prev=points[NUM_POINTS-2];
    const angle=Math.atan2(last.x-prev.x,last.y-prev.y)*180/Math.PI;
    const w=card.offsetWidth;

    card.style.left=(last.x-w/2)+'px';
    card.style.top=last.y+'px';
    card.style.transformOrigin='50% 0px';
    card.style.transform='rotate('+angle+'deg)';

    // Keep the reflection tied to the world light while the card rotates.
    // Velocity shifts the highlight so dragging/pulling visibly changes the sheen.
    const speed=Math.min(1,Math.hypot(cardVX,cardVY)/18);
    const shineX=50 + Math.max(-42,Math.min(42,cardVX*2.2));
    const shineY=50 + Math.max(-42,Math.min(42,cardVY*1.4));
    const shineAngle=112-angle*0.72;
    card.style.setProperty('--shine-x',shineX.toFixed(1)+'%');
    card.style.setProperty('--shine-y',shineY.toFixed(1)+'%');
    card.style.setProperty('--shine-angle',shineAngle.toFixed(1)+'deg');
    const shine=card.querySelector('.card-shine');
    if(shine) shine.style.opacity=(0.72+speed*0.28).toFixed(2);
    shine.style.transform='translate3d('+((shineX-50)*0.9).toFixed(1)+'px,'+((shineY-50)*0.55).toFixed(1)+'px,0)';

    const loop=card.querySelector('.badge-attachment');
    if(loop) loop.style.transform='translateX(-50%)';
  }

  let previous=performance.now();
  function loop(now){
    const dt=Math.min(32,now-previous);previous=now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
