<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avinash Tiwari</title>

<link
  href="https://fonts.googleapis.com/css2?family=Anton+SC&display=swap"
  rel="stylesheet"
>
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap"
  rel="stylesheet"
>
<link
  href="https://fonts.googleapis.com/css2?family=Peralta&display=swap"
  rel="stylesheet"
>
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap"
  rel="stylesheet"

<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#111;
}

html{
  scroll-behavior:smooth;
  scroll-snap-type:y mandatory;
}

body{
  overflow-x:hidden;
  background:#111 url("https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExamZqMm9udm1qeTRoZmtuejlqM2JwaGhhbW9rMGcyaHYxcXVucnIzdSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3ohhwhHdgMUUGQ97he/giphy.gif") center/cover fixed no-repeat;
}

.page{
  position:relative;
  width:100%;
  min-height:100vh;
  z-index:1;
  scroll-snap-align:start;
  scroll-snap-stop:always;
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg-gif{display:none;}


/* =========================================================
   NAME
========================================================= */

.name{
  position:absolute;
  bottom:18px;
  left:24px;
  z-index:10;
  font-family:'Anton SC',sans-serif;
  font-size:clamp(100px,14vw,220px);
  font-weight:400;
  color:rgb(66,66,66);
  line-height:0.85;
  white-space:nowrap;
}


/* =========================================================
   STICKY NOTES AREA
========================================================= */

.tag-wrapper{
  position:absolute;

  top:0;
  right:8%;

  width:345px;
  height:650px;

  z-index:11;

  transform-origin:
    50% 0%;

  animation:
    swing 4.5s
    ease-in-out
    infinite;

  cursor:pointer;
}


/* =========================================================
   THREAD
========================================================= */

.string{
  position:absolute;

  top:0;
  left:50%;

  width:5px;
  height:142px;

  background:#12151c;

  border-radius:3px;

  transform:
    translateX(-50%);

  z-index:20;
}


/* =========================================================
   TAG CARD
========================================================= */

.tag-card{
  position:absolute;

  top:120px;
  left:12.5px;

  width:320px;
  height:500px;

  perspective:1000px;
}


/* =========================================================
   TAG INNER
========================================================= */

.tag-inner{
  position:relative;

  width:100%;
  height:100%;

  transform-style:preserve-3d;

  transition:
    transform 0.7s
      cubic-bezier(.2,.75,.25,1),

    scale 0.3s ease;
}


/* =========================================================
   TAG HOVER
========================================================= */

.tag-wrapper:hover .tag-inner{
  scale:1.06;
}


/* =========================================================
   FLIP
========================================================= */

.tag-wrapper.flipped .tag-inner{
  transform:rotateY(180deg);
}


/* =========================================================
   TAG SIDES
========================================================= */

.tag{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  padding:
    63px
    42px
    45px;

  background:#eeeae2;

  clip-path:polygon(
    0 14%,
    14% 0,
    86% 0,
    100% 14%,
    100% 100%,
    0 100%
  );

  box-shadow:
    12px 15px 27px
    rgba(0,0,0,0.28);

  color:#123f4b;

  backface-visibility:hidden;

  -webkit-backface-visibility:hidden;

  overflow:hidden;
}


/* =========================================================
   PUNCH HOLE
========================================================= */

.punch-hole{
  position:absolute;

  top:18px;
  left:50%;

  width:22px;
  height:22px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:#12151c;

  box-shadow:
    inset 0 2px 5px
      rgba(0,0,0,0.55),

    0 0 0 2px
      rgba(0,0,0,0.10);

  z-index:8;
}


/* =========================================================
   FRONT
========================================================= */

.front{
  transform:rotateY(0deg);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:flex-start;
}


/* =========================================================
   AUTHOR TITLE
========================================================= */

.author-title{
  font-family:'Peralta',sans-serif;

  font-size:48px;

  font-weight:400;

  line-height:0.95;

  letter-spacing:1.5px;

  text-align:center;

  margin-top:20px;
}


/* =========================================================
   ABOUT ME
========================================================= */

.about-me{
  position:absolute;

  top:190px;

  left:35px;
  right:35px;

  font-family:'Peralta',sans-serif;

  font-size:16px;

  font-weight:400;

  line-height:1.45;

  color:#333;

  text-align:center;
}


/* =========================================================
   BACK
========================================================= */

.back{
  transform:rotateY(180deg);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:flex-start;

  padding-top:62px;

  position:absolute;
}


/* =========================================================
   CONTACT TITLE
========================================================= */

.tag h2{
  font-family:'Anton SC',sans-serif;

  font-size:48px;

  font-weight:400;

  line-height:0.95;

  letter-spacing:1.5px;

  margin:0;

  text-align:center;
}


/* =========================================================
   SOCIAL BUTTONS
========================================================= */

.contact-icons{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:38px;
}

.contact-icons .social-buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  background-color:#f2f2f2;
  box-shadow:0 0 15px #00000027;
  padding:15px 10px;
  border-radius:5em;
}

.contact-icons .social-button{
  display:flex;
  justify-content:center;
  align-items:center;
  width:50px;
  height:50px;
  border-radius:50%;
  margin:0 10px;
  background-color:#fff;
  box-shadow:0 0 4px #00000027;
  transition:0.3s;
  text-decoration:none;
}

.contact-icons .social-button:hover{
  background-color:#f2f2f2;
  box-shadow:0 0 6px 3px #00000027;
}

.contact-icons .social-button svg{
  transition:0.3s;
  width:20px;
  height:20px;
}

.contact-icons .linkedin{background-color:#0077b5;}
.contact-icons .linkedin svg{fill:#f2f2f2;}
.contact-icons .linkedin:hover svg{fill:#0077b5;}

.contact-icons .github{background-color:#333;}
.contact-icons .github svg{width:25px;height:25px;fill:#f2f2f2;}
.contact-icons .github:hover svg{fill:#333;}

.contact-icons .instagram{background-color:#c13584;}
.contact-icons .instagram svg{fill:#f2f2f2;}
.contact-icons .instagram:hover svg{fill:#c13584;}

/* =========================================================
   CONTACT FORM
========================================================= */

.contact-form{position:absolute;left:22px;right:22px;bottom:20px;display:flex;flex-direction:column;gap:8px;}
.contact-form input,.contact-form textarea{width:100%;box-sizing:border-box;border:1.5px solid #000;border-radius:0;outline:none;background:rgba(255,255,255,.72);color:#173f49;font-family:'Anton SC',sans-serif;font-size:13px;font-weight:600;padding:8px 10px;}
.contact-form input{height:34px;}
.contact-form textarea{height:62px;resize:none;}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:#555;opacity:1;}
.contact-form input:focus,.contact-form textarea:focus{border-color:#061f4f;}
.contact-form button{width:100%;height:34px;border:1.5px solid #061f4f;border-radius:0;background:#061f4f;color:#fff;font-family:'Anton SC',sans-serif;font-size:20px;font-weight:400;letter-spacing:1px;cursor:pointer;transition:background .2s ease,color .2s ease;}
.contact-form button:hover{background:#fff;color:#061f4f;}
.contact-form button:disabled{opacity:.6;cursor:wait;}
.form-status{min-height:14px;margin:0;font-family:Arial,sans-serif;font-size:11px;font-weight:700;line-height:1.1;text-align:center;color:#173f49;}


/* =========================================================
   TAG SWING
========================================================= */

@keyframes swing{

  0%{
    transform:rotate(3deg);
  }

  25%{
    transform:rotate(-4deg);
  }

  50%{
    transform:rotate(5deg);
  }

  75%{
    transform:rotate(-3deg);
  }

  100%{
    transform:rotate(3deg);
  }

}


/* =========================================================
   CONTENT SECTIONS — smooth fade-in blur
   No hard edges, no partitions.
   opacity driven by JS scroll detection.
========================================================= */

.content-section{
  position:relative;
  min-height:100vh;
  padding:0;
  /* NO overflow:hidden — that was causing the hard partition line */
  z-index:1;
  background:transparent;
  scroll-snap-align:start;
  scroll-snap-stop:always;
}

/* Blur overlay — opacity starts at 0, JS brings it to 1 */
.content-section::before{
  content:'';
  position:absolute;
  /* Extend 120px above and below to kill any gap/partition */
  top:0;
  left:0;
  right:0;
  bottom:0;
  z-index:0;
  backdrop-filter:grayscale(1) brightness(0.55);
  -webkit-backdrop-filter:grayscale(1) brightness(0.55);
  background:rgba(8,8,14,0.38);
  opacity: var(--blur-opacity, 0);
  transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events:none;
}

/* All children above the blur layer */
.content-section > *{
  position:relative;
  z-index:1;
}



.section-title{
  position:absolute;
  bottom:18px;
  left:30px;
  z-index:1;
  font-family:'Anton SC',sans-serif;
  font-size:clamp(52px,10vw,120px);
  font-weight:400;
  line-height:.95;
  letter-spacing:1px;
  color:#f4efe6;
  text-align:left;
}

/* Three brutalist cards arranged side by side — Uiverse.io by mayankk234 */
.projects-books{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:clamp(20px,3vw,48px);
  padding:40px 4vw 180px;
}

/* From Uiverse.io by mayankk234 */
.brutalist-card {
  flex: 1 1 0;
  min-width: 0;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  border: 4px solid #000;
  background-color: #f7c6dc;
  padding: clamp(1.4rem, 2.5vw, 2.2rem);
  box-shadow: 10px 10px 0 #000;
  font-family: "Arial", sans-serif;
  transition: transform 0.3s cubic-bezier(.25,.8,.25,1),
              box-shadow 0.3s cubic-bezier(.25,.8,.25,1);
  cursor: default;
}

.brutalist-card:hover {
  transform: scale(1.045) translateY(-6px);
  box-shadow: 16px 16px 0 #000;
}

.brutalist-card__header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
  border-bottom: 2px solid #000;
  padding-bottom: 1rem;
}

.brutalist-card__icon {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #000;
  padding: 0.5rem;
}

.brutalist-card__icon svg {
  height: 1.5rem;
  width: 1.5rem;
  fill: #fff;
}

.brutalist-card__alert {
  font-weight: 900;
  color: #000;
  font-size: clamp(1.3rem, 2vw, 1.9rem);
  text-transform: uppercase;
}

.brutalist-card__message {
  flex: 1;
  margin-top: 1rem;
  color: #000;
  font-size: clamp(0.9rem, 1.1vw, 1.1rem);
  line-height: 1.5;
  border-bottom: 2px solid #000;
  padding-bottom: 1rem;
  font-weight: 600;
}

.brutalist-card__actions {
  margin-top: 1rem;
}

.brutalist-card__button {
  display: block;
  width: 100%;
  padding: clamp(0.75rem, 1.2vw, 1.1rem);
  text-align: center;
  font-size: clamp(0.95rem, 1.1vw, 1.15rem);
  font-weight: 700;
  text-transform: uppercase;
  border: 3px solid #000;
  background-color: #fff;
  color: #000;
  position: relative;
  transition: all 0.2s ease;
  box-shadow: 5px 5px 0 #000;
  overflow: hidden;
  text-decoration: none;
  margin-bottom: 1rem;
  cursor: pointer;
}

.brutalist-card__button--read {
  background-color: #000;
  color: #fff;
}

.brutalist-card__button::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  transition: all 0.6s;
}

.brutalist-card__button:hover::before {
  left: 100%;
}

.brutalist-card__button:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 7px 0 #000;
}

.brutalist-card__button--mark:hover {
  background-color: #000000;
  border-color: #000000;
  color: #fff;
  box-shadow: 7px 7px 0 #000000;
}

.brutalist-card__button--read:hover {
  background-color: #ffffff;
  border-color: #000000;
  color: #000000;
  box-shadow: 7px 7px 0 #000000;
}

.brutalist-card__button:active {
  transform: translate(5px, 5px);
  box-shadow: none;
}


/* =========================================================
   DSA JOURNEY — LARGE CARD
========================================================= */

.dsa-layout{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:125px 4vw 165px;
}

.dsa-left{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dsa-right{
  display:none;
}

.dsa-new-card{
  width:min(900px,94vw);
  background:#fefefe;
  border-radius:1.25rem;
  padding:.65rem;
  color:#141417;
  box-shadow:0 22px 55px rgba(0,0,0,.28);
  font-family:'Anton SC',sans-serif;
}

.dsa-new-card__hero{
  background:#fef4e2;
  border-radius:.75rem .75rem 0 0;
  padding:2rem 2.2rem 2.1rem;
}

.dsa-new-card__job-title{
  margin:0 0 1.25rem;
  font-family:'Anton SC',sans-serif;
  font-size:clamp(38px,4.5vw,62px);
  line-height:.95;
  font-weight:400;
  letter-spacing:1px;
  color:#141417;
}

.dsa-new-card__description{
  margin:0;
  font-family:'Anton SC',sans-serif;
  font-size:clamp(16px,1.35vw,20px);
  color:#333;
  line-height:1.52;
  font-weight:400;
  letter-spacing:.35px;
}

.dsa-new-card__footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1.5rem;
  padding:1.15rem 1.25rem;
  font-family:'Anton SC',sans-serif;
}

.dsa-new-card__job-summary{
  display:flex;
  align-items:center;
  gap:.8rem;
  min-width:0;
}

.dsa-new-card__logo{
  width:52px;
  height:52px;
  object-fit:contain;
  display:block;
  flex-shrink:0;
}

.dsa-new-card__platform{
  display:flex;
  flex-direction:column;
  gap:3px;
  font-family:'Anton SC',sans-serif;
}

.dsa-new-card__platform-name{
  font-size:22px;
  color:#141417;
  letter-spacing:.5px;
}

.dsa-new-card__platform-sub{
  font-size:13px;
  color:#777;
  font-weight:400;
  letter-spacing:.5px;
}

.dsa-new-card__btn{
  width:max-content;
  border:none;
  display:block;
  cursor:pointer;
  text-align:center;
  padding:.75rem 1.5rem;
  border-radius:1rem;
  background:#141417;
  color:#fff;
  font-size:20px;
  text-decoration:none;
  font-family:'Anton SC',sans-serif;
  letter-spacing:1px;
  transition:transform .2s ease,opacity .2s ease;
  white-space:nowrap;
}

.dsa-new-card__btn:hover{
  transform:translateY(-3px);
  opacity:.88;
}

@media (max-width:700px){
  .dsa-layout{
    padding:110px 3vw 150px;
  }

  .dsa-new-card{
    width:94vw;
  }

  .dsa-new-card__hero{
    padding:1.4rem;
  }

  .dsa-new-card__description{
    font-size:14px;
    line-height:1.5;
  }

  .dsa-new-card__footer{
    flex-direction:column;
    align-items:stretch;
  }

  .dsa-new-card__btn{
    width:100%;
  }
}

.dsa-text p{
  margin:0;
}


/* Resume button — main screen only */
.resume-label{
  position:absolute;
  top:28px;
  left:30px;
  z-index:12;
  display:inline-block;
  padding:0;
  font-family:'Knewave', sans-serif !important;
  font-size:clamp(42px,4.6vw,68px);
  font-weight:400;
  line-height:1;
  letter-spacing:1px;
  color:#f2f0e8;
  -webkit-text-stroke:8px #000;
  paint-order:stroke fill;
  border:none;
  background:transparent;
  text-decoration:none;
  cursor:pointer;
  transition:transform .2s ease, background .2s ease;
}

.resume-label:hover{
  transform:translateY(-2px);
  background:transparent;
}

</style>

<style id="dsa-blank-card">
